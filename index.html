<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143c78"><title>CampusConnect | College Portal</title>
<style>
:root{--navy:#143c78;--blue:#2463eb;--pale:#eef4ff;--ink:#17243b;--muted:#64748b;--line:#e3eaf4;--green:#16845b;--red:#c24141;--amber:#a66308;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#eaf0fa;color:var(--navy)}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.top{background:linear-gradient(110deg,#143c78,#2563eb);color:white;padding:18px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:#ffffff22;display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;font-size:12px;color:#dbeafe}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.login{max-width:460px;margin:42px auto;background:white;padding:26px;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px #1d35570c}.login h2{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfd9e8;border-radius:10px;padding:11px;background:white;color:var(--ink);width:100%}.field textarea{min-height:70px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:3px}.tab{white-space:nowrap;background:white;color:var(--navy);border:1px solid var(--line)}.tab.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.metric{font-size:27px;font-weight:800;margin:5px 0}.pill{display:inline-block;background:var(--pale);color:var(--navy);border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750}.pill.green{background:#e7f8ef;color:var(--green)}.pill.red{background:#fff0f0;color:var(--red)}.pill.amber{background:#fff5df;color:var(--amber)}.wide{grid-column:1/-1}.half{grid-column:span 2}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}td strong{display:block}.notice{border-left:3px solid var(--blue);padding:9px 12px;background:#f7faff;border-radius:0 9px 9px 0;margin:8px 0}.notice b{display:block;font-size:13px}.notice small{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.toolbar h2{margin:0}.hint{background:#fff8e8;border:1px solid #f4dfac;border-radius:12px;padding:12px;font-size:12px;color:#774b00;margin:12px 0}.success{background:#e9f9f0;color:#166534;border-radius:10px;padding:10px;font-size:13px}.error{background:#fff0f0;color:#a61b1b;border-radius:10px;padding:10px;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}.hidden{display:none!important}.subnav{font-size:12px;color:var(--muted);margin-bottom:10px}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.half{grid-column:1/-1}.top{align-items:flex-start}.brand h1{font-size:17px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:14px}.wrap{margin:14px auto}.card{padding:14px}.login{margin:24px 8px;padding:20px}.metric{font-size:24px}.hide-mobile{display:none}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">🎓</div><div><h1>CampusConnect</h1><p>College Student & Administration Portal</p></div></div><div id="topUser" class="row" style="flex:0 0 auto"></div></header>
<main id="app" class="wrap"></main><footer class="footer">CampusConnect • Responsive college portal prototype • Use sample data for presentation</footer>
<script>
const KEY='cc_full_prototype_v1';
const defaults={college:'LNCT College',notices:[{id:1,title:'Welcome to CampusConnect',body:'Check your timetable, attendance and important updates from one place.',date:today(),audience:'All Students',type:'General'},{id:2,title:'Lab record reminder',body:'Bring your completed practical file to your next lab session.',date:today(),audience:'CSE First Year',type:'Academic'}],students:[{id:'CC26001',name:'Demo Student',email:'student@campusconnect.demo',password:'student123',branch:'CSE',semester:'1st Semester',roll:'26CSE001',section:'A'}],subjects:[{id:1,name:'Engineering Mathematics',code:'MA101',faculty:'Dr. Neha Sharma',room:'Room 204',day:'Monday',start:'09:00',end:'10:00',kind:'Lecture',semester:'1st Semester',branch:'CSE',active:true},{id:2,name:'Basic Electrical Engineering',code:'EE101',faculty:'Prof. Amit Verma',room:'Electrical Lab',day:'Monday',start:'10:15',end:'12:15',kind:'Lab',semester:'1st Semester',branch:'CSE',active:true},{id:3,name:'Engineering Communication',code:'EC101',faculty:'Ms. Ritu Jain',room:'Room 105',day:'Monday',start:'13:00',end:'14:00',kind:'Lecture',semester:'1st Semester',branch:'CSE',active:true},{id:4,name:'Engineering Drawing',code:'ED101',faculty:'Mr. Kunal Shah',room:'Drawing Hall',day:'Tuesday',start:'09:00',end:'11:00',kind:'Workshop',semester:'1st Semester',branch:'CSE',active:true},{id:5,name:'Programming in C',code:'CS101',faculty:'Mr. Rahul Patel',room:'Computer Lab 2',day:'Tuesday',start:'11:15',end:'13:15',kind:'Lab',semester:'1st Semester',branch:'CSE',active:true},{id:6,name:'Engineering Chemistry',code:'CH101',faculty:'Dr. Pooja Mehta',room:'Chemistry Lab',day:'Wednesday',start:'10:00',end:'12:00',kind:'Lab',semester:'1st Semester',branch:'CSE',active:true},{id:7,name:'Programming in C',code:'CS101',faculty:'Mr. Rahul Patel',room:'Room 302',day:'Thursday',start:'09:00',end:'10:00',kind:'Lecture',semester:'1st Semester',branch:'CSE',active:true},{id:8,name:'Engineering Mathematics',code:'MA101',faculty:'Dr. Neha Sharma',room:'Room 204',day:'Friday',start:'09:00',end:'10:00',kind:'Lecture',semester:'1st Semester',branch:'CSE',active:true}],attendance:[],events:[{id:1,title:'CSE Orientation Workshop',date:today(),time:'15:00',place:'Seminar Hall',type:'Workshop',details:'Bring your college ID card.'}],faculty:[{name:'Dr. Neha Sharma',dept:'Mathematics',status:'Available'},{name:'Prof. Amit Verma',dept:'Electrical',status:'In Lab'},{name:'Mr. Rahul Patel',dept:'Computer Science',status:'Available'},{name:'Ms. Ritu Jain',dept:'Communication',status:'In Class'}]};
function today(){return new Date().toISOString().slice(0,10)}function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return JSON.parse(JSON.stringify(defaults))}}let db=load(),session=null,tab='dashboard';function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(t){if(!t)return '';let [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}function dayName(d=today()){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'})}function student(){return db.students.find(s=>s.id===session?.id)}function schedule(day=dayName()){return db.subjects.filter(s=>s.active&&s.day===day&&(!student()||s.semester===student().semester&&s.branch===student().branch)).sort((a,b)=>a.start.localeCompare(b.start))}function records(){return db.attendance.filter(a=>a.studentId===session?.id)}function percent(sub){let a=records().filter(x=>x.subjectId===sub.id);return a.length?Math.round(a.filter(x=>x.status==='Present').length/a.length*100):0}function card(title,body,cls=''){return `<section class="card ${cls}"><h3>${title}</h3>${body}</section>`}function top(){document.getElementById('topUser').innerHTML=session?`<span style="font-size:12px;color:#e2eaff">${esc(session.name)} · ${session.role==='admin'?'Admin':'Student'}</span><button class="secondary small" onclick="logout()">Log out</button>`:''}
function render(){top();let app=document.getElementById('app');if(!session){app.innerHTML=`<section class="login"><div class="pill">COLLEGE PORTAL</div><h2 style="margin-top:12px">Sign in to CampusConnect</h2><p class="muted">Students can view their personal dashboard. College admins can manage timetable, attendance, notices and faculty status.</p><div class="field"><label>Login as</label><select id="role"><option value="student">Student</option><option value="admin">College Admin</option></select></div><div class="field"><label>Email / Student ID</label><input id="email" value="student@campusconnect.demo" placeholder="Enter email or student ID"></div><div class="field"><label>Password</label><input id="password" type="password" value="student123" placeholder="Password"></div><button style="width:100%" onclick="login()">Sign in</button><div id="loginMsg"></div><div class="hint"><b>Presentation demo accounts</b><br>Student: <code>student@campusconnect.demo</code> / <code>student123</code><br>Admin: <code>admin@campusconnect.demo</code> / <code>admin123</code><br><br>This frontend demo stores data only in this browser. Real secure online accounts require a backend.</div></section>`;return}
let tabs=session.role==='admin'?[['dashboard','Overview'],['timetable','Timetable'],['attendance','Attendance'],['students','Students'],['notices','Notices'],['events','Events & Labs'],['faculty','Faculty']]:[['dashboard','My Dashboard'],['profile','My Profile'],['timetable','My Timetable'],['attendance','My Attendance'],['subjects','My Subjects'],['notices','Notices'],['events','Events & Labs'],['faculty','Faculty Status']];app.innerHTML=`<div class="toolbar"><div><div class="subnav">${esc(db.college)} / ${session.role==='admin'?'Administration':'Student Portal'}</div><h2>${session.role==='admin'?'College control centre':'Hello, '+esc(session.name.split(' ')[0])+' 👋'}</h2></div><span class="pill">${esc(today())} · ${esc(dayName())}</span></div><nav class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><div id="view"></div>`;renderView()}
function go(t){tab=t;render()}function renderView(){let v=document.getElementById('view');if(!v)return;let html='';if(tab==='dashboard')html=session.role==='admin'?adminHome():studentHome();if(tab==='profile')html=profileView();if(tab==='timetable')html=timetableView();if(tab==='attendance')html=attendanceView();if(tab==='subjects')html=subjectsView();if(tab==='notices')html=noticesView();if(tab==='events')html=eventsView();if(tab==='faculty')html=facultyView();if(tab==='students')html=studentsView();v.innerHTML=html}
function studentHome(){let s=student(),sc=schedule(),att=records(),pres=att.filter(a=>a.status==='Present').length,pct=att.length?Math.round(pres/att.length*100):0;return `<div class="grid">${card('Attendance overall',`<div class="metric">${pct}%</div><span class="muted">${pres} present out of ${att.length} marked classes</span><div style="height:7px;background:#e8edf5;border-radius:8px;margin-top:12px"><div style="height:7px;width:${pct}%;background:#16845b;border-radius:8px"></div></div>`)}${card("Today's classes",`<div class="metric">${sc.length}</div><span class="muted">${sc.filter(x=>x.kind==='Lab').length} labs · ${sc.filter(x=>x.kind==='Workshop').length} workshops</span>`)}${card('Profile',`<div class="metric" style="font-size:19px">${esc(s?.roll||'Not set')}</div><span class="muted">${esc(s?.branch||'')} · ${esc(s?.semester||'')}</span><p><button class="secondary small" onclick="go('profile')">View profile</button></p>`)}${card("Today's timetable",sc.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Class</th><th>Room</th></tr></thead><tbody>${sc.map(x=>`<tr><td>${fmt(x.start)}–${fmt(x.end)}</td><td><strong>${esc(x.name)}</strong><span class="pill">${esc(x.kind)}</span><div class="muted">${esc(x.faculty)}</div></td><td>${esc(x.room)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No classes scheduled today. Enjoy your free time!</div>`,'half')}${card('Upcoming updates',db.notices.slice(0,3).map(n=>`<div class="notice"><b>${esc(n.title)}</b><small>${esc(n.date)} · ${esc(n.type)}</small><div>${esc(n.body)}</div></div>`).join('')||'<div class="empty">No notices yet.</div>','half')}${card('Quick actions',`<div class="actions"><button onclick="go('attendance')">Mark attendance</button><button class="secondary" onclick="go('timetable')">Full timetable</button><button class="secondary" onclick="go('events')">Labs & workshops</button></div>`,'wide')}</div>`}
function adminHome(){return `<div class="grid">${card('Registered students',`<div class="metric">${db.students.length}</div><span class="muted">Demo records in this browser</span>`)}${card('Scheduled classes',`<div class="metric">${db.subjects.length}</div><span class="muted">Lectures, labs and workshops</span>`)}${card('Notices published',`<div class="metric">${db.notices.length}</div><span class="muted">Visible in student portal</span>`)}${card('Manage college data',`<div class="actions"><button onclick="go('timetable')">Edit timetable</button><button onclick="go('notices')">Publish notice</button><button onclick="go('events')">Add lab/workshop</button><button class="secondary" onclick="go('faculty')">Faculty status</button></div>`,'wide')}${card('Today schedule',schedule().length?schedule().map(s=>`<div class="notice"><b>${esc(s.name)} · ${fmt(s.start)}–${fmt(s.end)}</b><small>${esc(s.faculty)} · ${esc(s.room)} · ${esc(s.kind)}</small></div>`).join(''):'<div class="empty">No classes scheduled for today.</div>','half')}${card('Admin tools',`<p class="muted">Use the tabs above to update timetable, mark attendance for a student, publish notices and edit faculty availability.</p><button class="secondary" onclick="exportData()">Export backup JSON</button> <button class="danger" onclick="resetData()">Reset demo data</button>`,'half')}</div>`}
function profileView(){let s=student();return `<div class="grid">${card('My student profile',`<form onsubmit="saveProfile(event)"><div class="field"><label>Full name</label><input name="name" required value="${esc(s.name)}"></div><div class="row"><div class="field"><label>Student ID</label><input value="${esc(s.id)}" disabled></div><div class="field"><label>Roll number</label><input name="roll" value="${esc(s.roll)}"></div></div><div class="field"><label>College email</label><input name="email" type="email" required value="${esc(s.email)}"></div><div class="row"><div class="field"><label>Branch</label><select name="branch"><option ${s.branch==='CSE'?'selected':''}>CSE</option><option ${s.branch==='IT'?'selected':''}>IT</option><option ${s.branch==='ECE'?'selected':''}>ECE</option><option ${s.branch==='ME'?'selected':''}>ME</option><option ${s.branch==='Civil'?'selected':''}>Civil</option></select></div><div class="field"><label>Semester</label><select name="semester">${['1st Semester','2nd Semester','3rd Semester','4th Semester','5th Semester','6th Semester','7th Semester','8th Semester'].map(x=>`<option ${s.semester===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Section</label><input name="section" value="${esc(s.section||'A')}"></div><button>Save profile</button></form>`,'half')}${card('Account details',`<p><b>Role:</b> Student</p><p><b>Branch:</b> ${esc(s.branch)}</p><p><b>Semester:</b> ${esc(s.semester)}</p><p class="muted">Demo profile details save in this browser only. Do not enter sensitive personal information in this prototype.</p>`)}</div>`}
function timetableView(){let admin=session.role==='admin';let days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let list=db.subjects.filter(s=>admin||s.branch===student().branch&&s.semester===student().semester).sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||a.start.localeCompare(b.start));return `<div class="grid">${admin?card('Add / edit class',`<form onsubmit="addSubject(event)"><div class="field"><label>Subject / activity</label><input name="name" required placeholder="Programming in C"></div><div class="row"><div class="field"><label>Subject code</label><input name="code" placeholder="CS101"></div><div class="field"><label>Type</label><select name="kind"><option>Lecture</option><option>Lab</option><option>Workshop</option><option>Tutorial</option><option>Holiday</option></select></div></div><div class="row"><div class="field"><label>Day</label><select name="day">${days.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Semester</label><select name="semester">${['1st Semester','2nd Semester','3rd Semester','4th Semester','5th Semester','6th Semester','7th Semester','8th Semester'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Start time</label><input type="time" name="start" required value="09:00"></div><div class="field"><label>End time</label><input type="time" name="end" required value="10:00"></div></div><div class="field"><label>Faculty</label><input name="faculty" placeholder="Faculty name"></div><div class="row"><div class="field"><label>Room / Lab</label><input name="room" placeholder="Room 204"></div><div class="field"><label>Branch</label><select name="branch"><option>CSE</option><option>IT</option><option>ECE</option><option>ME</option><option>Civil</option></select></div></div><button>Add to timetable</button></form>`,'half'):card('My timetable',`<p class="muted">Your timetable is filtered by your branch and semester. The college admin manages the official schedule.</p><span class="pill">${esc(student().branch)} · ${esc(student().semester)}</span>`,'half')}${card(admin?'Current timetable — edit or remove':'Weekly classes',`<div class="tablewrap"><table><thead><tr><th>Day / Time</th><th>Subject / type</th><th>Faculty / room</th>${admin?'<th>Action</th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td><strong>${s.day}</strong>${fmt(s.start)}–${fmt(s.end)}</td><td><strong>${esc(s.name)}</strong><span class="pill">${esc(s.kind)}</span><div class="muted">${esc(s.code)}</div></td><td>${esc(s.faculty)}<div class="muted">${esc(s.room)}</div></td>${admin?`<td><button class="danger small" onclick="delSubject(${s.id})">Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan="4">No classes found.</td></tr>'}</tbody></table></div>`,'wide')}</div>`}
function attendanceView(){let admin=session.role==='admin';let subs=db.subjects.filter(s=>s.kind==='Lecture'||s.kind==='Lab'||s.kind==='Workshop');let list=admin?db.attendance:records();return `<div class="grid">${admin?card('Record attendance',`<form onsubmit="markAttendance(event)"><div class="field"><label>Student</label><select name="studentId">${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select></div><div class="field"><label>Subject / class</label><select name="subjectId">${subs.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.day}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Status</label><select name="status"><option>Present</option><option>Absent</option><option>Excused</option></select></div><button>Save attendance</button></form>`,'half'):card('Mark my attendance (personal tracker)',`<form onsubmit="markMyAttendance(event)"><div class="field"><label>Class / subject</label><select name="subjectId">${subs.filter(s=>s.branch===student().branch&&s.semester===student().semester).map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.day}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Status</label><select name="status"><option>Present</option><option>Absent</option></select></div><button>Save my record</button></form><p class="muted">Personal self-tracking only; it is not official attendance unless college staff verify it.</p>`,'half')}${card(admin?'Attendance records':'My attendance by subject',`<div class="tablewrap"><table><thead><tr>${admin?'<th>Student</th>':''}<th>Date</th><th>Subject</th><th>Status</th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>{let s=db.subjects.find(x=>x.id===a.subjectId),st=db.students.find(x=>x.id===a.studentId);return `<tr>${admin?`<td>${esc(st?.name||a.studentId)}</td>`:''}<td>${esc(a.date)}</td><td>${esc(s?.name||'Deleted subject')}</td><td><span class="pill ${a.status==='Present'?'green':a.status==='Absent'?'red':'amber'}">${esc(a.status)}</span></td></tr>`}).join('')||`<tr><td colspan="${admin?4:3}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`,'wide')}${!admin?card('Subject-wise attendance',subs.filter(s=>s.branch===student().branch&&s.semester===student().semester).map(s=>{let a=records().filter(x=>x.subjectId===s.id),p=a.filter(x=>x.status==='Present').length,per=a.length?Math.round(p/a.length*100):0;return `<div style="margin:12px 0"><div class="row"><strong>${esc(s.name)}</strong><b>${per}%</b></div><div style="height:7px;background:#e8edf5;border-radius:8px;margin-top:6px"><div style="height:7px;width:${per}%;background:${per<75?'#c24141':'#16845b'};border-radius:8px"></div></div><small class="muted">${p}/${a.length} marked present</small></div>`}).join('')||'No subjects yet.','wide'):''}</div>`}
function subjectsView(){return `<div class="grid">${db.subjects.filter(s=>s.branch===student().branch&&s.semester===student().semester).map(s=>{let a=records().filter(x=>x.subjectId===s.id),p=a.filter(x=>x.status==='Present').length,per=a.length?Math.round(p/a.length*100):0;return card(esc(s.name),`<span class="pill">${esc(s.code)} · ${esc(s.kind)}</span><p class="muted">${s.day} · ${fmt(s.start)}–${fmt(s.end)}</p><p>${esc(s.faculty)}</p><p class="muted">${esc(s.room)}</p><div class="row"><b>Attendance</b><b>${per}%</b></div><div style="height:7px;background:#e8edf5;border-radius:8px;margin-top:6px"><div style="height:7px;width:${per}%;background:#16845b;border-radius:8px"></div></div>`)}).join('')||'<div class="empty">No subjects assigned.</div>'}</div>`}
function noticesView(){let admin=session.role==='admin';return `<div class="grid">${admin?card('Publish notice',`<form onsubmit="addNotice(event)"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Details</label><textarea name="body" required></textarea></div><div class="row"><div class="field"><label>Audience</label><select name="audience"><option>All Students</option><option>CSE First Year</option><option>Faculty</option></select></div><div class="field"><label>Type</label><select name="type"><option>General</option><option>Academic</option><option>Exam</option><option>Holiday</option><option>Urgent</option></select></div></div><button>Publish notice</button></form>`,'half'):card('Notice board',`<p class="muted">Official updates posted by the college administration.</p>`,'half')}${card(admin?'Published notices':'Latest notices',db.notices.map(n=>`<div class="notice"><b>${esc(n.title)} ${admin?`<button class="danger small" onclick="delNotice(${n.id})">Delete</button>`:''}</b><small>${esc(n.date)} · ${esc(n.audience)} · ${esc(n.type)}</small><div>${esc(n.body)}</div></div>`).join('')||'<div class="empty">No notices yet.</div>','wide')}</div>`}
function eventsView(){let admin=session.role==='admin';return `<div class="grid">${admin?card('Add lab / workshop / holiday',`<form onsubmit="addEvent(event)"><div class="field"><label>Event name</label><input name="title" required placeholder="Workshop / Lab / Holiday"></div><div class="row"><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Time</label><input type="time" name="time" value="10:00"></div></div><div class="row"><div class="field"><label>Type</label><select name="type"><option>Lab</option><option>Workshop</option><option>Holiday</option><option>Exam</option><option>Event</option></select></div><div class="field"><label>Venue</label><input name="place" placeholder="Lab 2 / Seminar Hall"></div></div><div class="field"><label>Details</label><textarea name="details"></textarea></div><button>Add event</button></form>`,'half'):card('Labs, workshops & holidays',`<p class="muted">Check special activities and college calendar updates.</p>`,'half')}${card(admin?'College calendar':'Upcoming activities',db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="notice"><b>${esc(e.title)} ${admin?`<button class="danger small" onclick="delEvent(${e.id})">Delete</button>`:''}</b><small>${esc(e.date)} · ${fmt(e.time)} · ${esc(e.type)} · ${esc(e.place)}</small><div>${esc(e.details||'')}</div></div>`).join('')||'<div class="empty">No events listed.</div>','wide')}</div>`}
function facultyView(){let admin=session.role==='admin';return `<div class="grid">${admin?card('Update faculty availability',`<form onsubmit="addFaculty(event)"><div class="field"><label>Faculty name</label><input name="name" required></div><div class="field"><label>Department</label><input name="dept" required></div><div class="field"><label>Status</label><select name="status"><option>Available</option><option>In Class</option><option>In Lab</option><option>On Leave</option><option>Meeting</option></select></div><button>Add faculty status</button></form>`,'half'):card('Faculty availability',`<p class="muted">Availability is only as accurate as the latest update entered by the college. It is not live location tracking.</p>`,'half')}${card(admin?'Faculty list':'Faculty status board',db.faculty.map((f,i)=>`<div class="notice"><b>${esc(f.name)}</b><small>${esc(f.dept)}</small><span class="pill ${f.status==='Available'?'green':f.status==='On Leave'?'red':'amber'}">${esc(f.status)}</span>${admin?` <button class="secondary small" onclick="cycleFaculty(${i})">Change status</button> <button class="danger small" onclick="delFaculty(${i})">Remove</button>`:''}</div>`).join('')||'<div class="empty">No faculty records.</div>','wide')}</div>`}
function studentsView(){return `<div class="grid">${card('Add student account',`<form onsubmit="addStudent(event)"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Student ID</label><input name="id" required placeholder="CC26002"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Temporary password</label><input name="password" required value="student123"></div><div class="row"><div class="field"><label>Branch</label><select name="branch"><option>CSE</option><option>IT</option><option>ECE</option><option>ME</option><option>Civil</option></select></div><div class="field"><label>Semester</label><select name="semester">${['1st Semester','2nd Semester','3rd Semester','4th Semester','5th Semester','6th Semester','7th Semester','8th Semester'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Roll number</label><input name="roll"></div><button>Add student</button></form>`,'half')}${card('Student directory',`<div class="tablewrap"><table><thead><tr><th>Name / ID</th><th>Branch</th><th>Login email</th><th>Action</th></tr></thead><tbody>${db.students.map(s=>`<tr><td><strong>${esc(s.name)}</strong>${esc(s.id)}</td><td>${esc(s.branch)}<div class="muted">${esc(s.semester)}</div></td><td>${esc(s.email)}</td><td>${s.id===session.id?'Current user':`<button class="danger small" onclick="delStudent('${esc(s.id)}')">Delete</button>`}</td></tr>`).join('')}</tbody></table></div>`,'wide')}</div>`}
function login(){let role=document.getElementById('role').value,e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;let s;if(role==='admin'&&e==='admin@campusconnect.demo'&&p==='admin123'){session={role:'admin',id:'ADMIN',name:'College Admin'}}else if(role==='student'){s=db.students.find(x=>(x.email.toLowerCase()===e||x.id.toLowerCase()===e)&&x.password===p);if(s)session={role:'student',id:s.id,name:s.name}}if(!session){document.getElementById('loginMsg').innerHTML='<p class="error">Login details not recognised. Use the demo credentials shown below.</p>';return}tab='dashboard';render()}
function logout(){session=null;render()}function saveProfile(e){e.preventDefault();let f=new FormData(e.target),s=student();s.name=f.get('name');s.email=f.get('email');s.roll=f.get('roll');s.branch=f.get('branch');s.semester=f.get('semester');s.section=f.get('section');session.name=s.name;save();render();alert('Profile saved on this browser.')}
function addSubject(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.end<=f.start){alert('End time must be later than start time.');return}db.subjects.push({...f,id:Date.now(),active:true});save();renderView();alert('Class added to timetable.')};function delSubject(id){if(confirm('Delete this timetable item?')){db.subjects=db.subjects.filter(s=>s.id!==id);save();renderView()}}
function markAttendance(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.attendance.push({...f,id:Date.now(),subjectId:Number(f.subjectId)});save();renderView();alert('Attendance record saved in this browser.')};function markMyAttendance(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.attendance.push({...f,id:Date.now(),studentId:session.id,subjectId:Number(f.subjectId)});save();renderView();alert('Personal attendance saved in this browser.')}
function addNotice(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.notices.unshift({...f,id:Date.now(),date:today()});save();renderView();alert('Notice published in this browser.')};function delNotice(id){db.notices=db.notices.filter(n=>n.id!==id);save();renderView()}
function addEvent(e){e.preventDefault();db.events.push({...Object.fromEntries(new FormData(e.target)),id:Date.now()});save();renderView();alert('Event saved.')};function delEvent(id){db.events=db.events.filter(x=>x.id!==id);save();renderView()}
function addFaculty(e){e.preventDefault();db.faculty.push(Object.fromEntries(new FormData(e.target)));save();renderView()};function cycleFaculty(i){let a=['Available','In Class','In Lab','On Leave','Meeting'],f=db.faculty[i];f.status=a[(a.indexOf(f.status)+1)%a.length];save();renderView()};function delFaculty(i){db.faculty.splice(i,1);save();renderView()}
function addStudent(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(db.students.some(s=>s.id===f.id||s.email===f.email)){alert('Student ID or email already exists.');return}db.students.push(f);save();renderView();alert('Student account added. Share the temporary demo login securely.')};function delStudent(id){if(confirm('Delete this student?')){db.students=db.students.filter(s=>s.id!==id);db.attendance=db.attendance.filter(a=>a.studentId!==id);save();renderView()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='campusconnect-backup.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Reset all browser demo data? This cannot be undone.')){db=JSON.parse(JSON.stringify(defaults));save();render()}}
render();
</script></body></html>
